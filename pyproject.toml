[project]
name = "weather-regimes-grams"
version = "0.1.0"
description = "Research project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pipeline infrastructure — required by the template itself
    "ipykernel>=6.29.0",
    "jupytext>=1.19.0",
    "nbconvert>=7.0.0",
    "mystmd>=1.8.0",
    "nbformat>=5.10.0",
    "snakemake>=8.0.0",
    # project-specific analysis packages
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "netCDF4>=1.7.0",
    "xarray>=2024.0.0",
    "gcsfs>=2024.0.0",
    "zarr>=2.18.0",
    "scipy>=1.13.0",
    "pyarrow>=16.0.0",
    "geopandas>=1.1.3",
    "cartopy>=0.25.0",
    "imageio>=2.37.3",
    "scikit-learn>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wr"]
